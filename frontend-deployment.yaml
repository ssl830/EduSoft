apiVersion: apps/v1
kind: Deployment
metadata:
  name: edusoft-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: edusoft-frontend
  template:
    metadata:
      labels:
        app: edusoft-frontend
    spec:
      containers:
      - name: edusoft-frontend
        image: ${{ secrets.DOCKERHUB_USERNAME }}/edusoft-frontend:latest
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: edusoft-frontend-service
spec:
  type: NodePort
  selector:
    app: edusoft-frontend
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
      nodePort: 30080