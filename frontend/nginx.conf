worker_processes 1;
events { worker_connections 1024; }

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;

    server {
        listen 80;
        server_name localhost;

        # 静态资源托管
        root /usr/share/nginx/html;
        index index.html;

        # 前端路由 fallback
        location / {
            try_files $uri $uri/ /index.html;
        }

        # 8081 user-service
        location /api/user {
            proxy_pass http://host.docker.internal:8081;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
        # 8082 imports/courses/classes
        location /api/imports {
            proxy_pass http://host.docker.internal:8082;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
        location /api/courses {
            proxy_pass http://host.docker.internal:8082;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
        location /api/classes {
            proxy_pass http://host.docker.internal:8082;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
        # 8083 content/discussion/homework等
        location /service3 {
            proxy_pass http://host.docker.internal:8083;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
        location /api/content {
            proxy_pass http://host.docker.internal:8083;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
        location /api/resources {
            proxy_pass http://host.docker.internal:8083;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
        location /api/discussion {
            proxy_pass http://host.docker.internal:8083;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
        location /api/discussion-like {
            proxy_pass http://host.docker.internal:8083;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
        location /api/discussion-reply {
            proxy_pass http://host.docker.internal:8083;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
        location /api/homework {
            proxy_pass http://host.docker.internal:8083;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # 8084 相关接口
        location ~ ^/api/(judge|record|practice|selfpractice|submission|learning|health|ai|chat|embedding|rag|storage|video|admin) {
            proxy_pass http://host.docker.internal:8084;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}
