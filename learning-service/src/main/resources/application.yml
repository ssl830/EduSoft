server:
  port: 8082
spring:
  application:
    name: learning-service
  datasource:
    url: jdbc:mysql://localhost:3306/learning_db?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
    username: root
    password: password # 请替换为你的数据库密码
    driver-class-name: com.mysql.cj.jdbc.Driver
mybatis:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true
logging:
  level:
    '[org.example.edusoft.learning.mapper]': debug

service:
  user:
    url: http://localhost:8081 # user-service的地址
  course:
    url: http://localhost:8083 # course-service的地址
