server:
  port: 8084
spring:
  application:
    name: learning-service
  datasource:
    url: jdbc:mysql://localhost:3306/learning_db?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
    username: root
    password: fkq200566
    driver-class-name: com.mysql.cj.jdbc.Driver
mybatis:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true
logging:
  level:
    '[org.example.edusoft.learning.mapper]': debug
    '[org.example.edusoft.learning.client]': debug
    '[org.example.edusoft.learning.service.impl]': debug
    '[org.example.edusoft.learning.controller]': debug

# 微服务地址配置
service:
  user:
    url: http://localhost:8081 # user-service的地址
  course:
    url: http://localhost:8082 # course-service的地址
  content:
    url: http://localhost:8083 # content-service的地址

# AI服务配置
ai:
  service:
    url: http://localhost:8000 # Python AI服务地址

# HTTP客户端配置
http:
  client:
    connect-timeout: 5000 # 连接超时时间(ms)
    read-timeout: 10000   # 读取超时时间(ms)
    max-connections: 100  # 最大连接数
    max-connections-per-route: 20 # 每个路由的最大连接数

# Actuator 健康检查配置
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

# Sa-Token 配置
sa-token:
  # token名称 (同时也是cookie名称)
  token-name: satoken
  # token有效期，单位s 默认30天, -1代表永不过期
  timeout: 2592000
  # 是否允许同一账号并发登录 (为true时允许一起登录, 为false时新登录挤掉旧登录)
  is-concurrent: true
  # 在多人登录同一账号时，是否共用一个token (为true时所有登录共用一个token, 为false时每次登录新建一个token)
  is-share: true
  # token风格
  token-style: uuid
  # 是否输出操作日志
  is-log: false
