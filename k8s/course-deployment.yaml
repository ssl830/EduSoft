apiVersion: apps/v1
kind: Deployment
metadata:
  name: edusoft-course-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: edusoft-course-service
  template:
    metadata:
      labels:
        app: edusoft-course-service
    spec:
      containers:
        - name: edusoft-course-service
          image: fankeqing/edusoft:edusoft-course-service
          ports:
            - containerPort: 8082
          env:
            - name: SPRING_DATASOURCE_URL
              value: "jdbc:mysql://edusoft-mysql:3306/course_db?useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai"
            - name: SPRING_DATASOURCE_USERNAME
              value: "root"
            - name: SPRING_DATASOURCE_PASSWORD
              value: "fkq200566"
            - name: SERVICES_USER_BASE_URL
              value: "http://edusoft-user-service:8081"
---
apiVersion: v1
kind: Service
metadata:
  name: edusoft-course-service
spec:
  type: NodePort
  selector:
    app: edusoft-course-service
  ports:
    - protocol: TCP
      port: 8082
      targetPort: 8082
      nodePort: 30082