apiVersion: apps/v1
kind: Deployment
metadata:
  name: content-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: content-service
  template:
    metadata:
      labels:
        app: content-service
    spec:
      containers:
        - name: content-service
          image: fankeqing/edusoft:edusoft-content-service
          ports:
            - containerPort: 8083
          env:
            - name: SPRING_DATASOURCE_URL
              value: "jdbc:mysql://edusoft-mysql:3306/content-db?useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai"
            - name: SPRING_DATASOURCE_USERNAME
              value: "root"
            - name: SPRING_DATASOURCE_PASSWORD
              value: "fkq200566"
            - name: SERVICES_USER_BASE_URL
              value: "http://user-service:8081"
            - name: SERVICES_COURSE_URL
              value: "http://course-service:8082"
---
apiVersion: v1
kind: Service
metadata:
  name: content-service
spec:
  type: NodePort
  selector:
    app: content-service
  ports:
    - protocol: TCP
      port: 8083
      targetPort: 8083
      nodePort: 30083