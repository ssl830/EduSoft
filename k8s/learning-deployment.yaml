apiVersion: apps/v1
kind: Deployment
metadata:
  name: learning-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: learning-service
  template:
    metadata:
      labels:
        app: learning-service
    spec:
      containers:
        - name: learning-service
          image: fankeqing/edusoft:edusoft-learning-service
          ports:
            - containerPort: 8084
          env:
            - name: SPRING_DATASOURCE_URL
              value: "jdbc:mysql://edusoft-mysql:3306/learning_db?useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai"
            - name: SPRING_DATASOURCE_USERNAME
              value: "root"
            - name: SPRING_DATASOURCE_PASSWORD
              value: "fkq200566"
            - name: SERVICES_USER_BASE_URL
              value: "http://user-service:8081"
            - name: SERVICES_COURSE_URL
              value: "http://course-service:8082"
---
apiVersion: v1
kind: Service
metadata:
  name: learning-service
spec:
  type: NodePort
  selector:
    app: learning-service
  ports:
    - protocol: TCP
      port: 8084
      targetPort: 8084
      nodePort: 30084