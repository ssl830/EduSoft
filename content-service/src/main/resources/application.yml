server:
  port: 8083

spring:
  application:
    name: content-service
  profiles:
    include: oss
  
  datasource:
    url: jdbc:mysql://localhost:3306/content-db?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai
    username: root
    password: fkq200566
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true

  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB

# 文件上传配置
file:
  upload:
    path: /uploads/
    allowed-types: jpg,jpeg,png,gif,pdf,doc,docx,xls,xlsx,ppt,pptx,txt,zip,rar

# 日志配置
logging:
  level:
    '[org.example.edusoft.content]': DEBUG
    '[org.mybatis]': DEBUG
    '[org.apache.ibatis]': DEBUG
    '[org.springframework.cloud.openfeign]': DEBUG
    org.example.edusoft.content.config.TokenInterceptor: DEBUG
    org.example.edusoft.content.mapper: DEBUG
    org.example.edusoft.content.service: DEBUG

# MyBatis 配置
mybatis:
  mapper-locations: classpath:mapper/**/*.xml
  type-aliases-package: org.example.edusoft.content.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    cache-enabled: false
    lazy-loading-enabled: false
    aggressive-lazy-loading: false

# Feign配置
feign:
  client:
    config:
      default:
        connectTimeout: 5000
        readTimeout: 5000
        loggerLevel: full
  compression:
    request:
      enabled: true
    response:
      enabled: true

# 微服务配置
user:
  service:
    url: http://user-service:8081

course:
  service:
    url: http://course-service:8082

# AI 服务配置
ai:
  service:
    url: http://ai-service:8000

# Actuator 健康检查配置
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

