server:
  port: 8083

spring:
  application:
    name: content-service
  profiles:
    include: oss
  
  datasource:
    url: jdbc:mysql://localhost:3306/content-db?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai
    username: root
    password: Fuchen20050420
    driver-class-name: com.mysql.cj.jdbc.Driver

  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB

# 文件上传配置
file:
  upload:
    path: /uploads/
    allowed-types: jpg,jpeg,png,gif,pdf,doc,docx,xls,xlsx,ppt,pptx,txt,zip,rar

# 日志配置
logging:
  level:
    '[org.example.edusoft.content]': DEBUG

# MyBatis 配置
mybatis:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

# 微服务配置
user:
  service:
    url: http://localhost:8081

course:
  service:
    url: http://localhost:8082

# Actuator 健康检查配置
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized
