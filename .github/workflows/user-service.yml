name: User Service CI/CD Pipeline

# 专用于micro_user_service分支的用户服务CI/CD流水线
on:
  push:
    branches:
      - micro_user_service
    # 由于这是专用分支，监听所有变更
  pull_request:
    branches:
      - micro_user_service

env:
  REGISTRY: crpi-z38aw29its2zwb1p.cn-beijing.personal.cr.aliyuncs.com
  IMAGE_NAME: sjy330/edusoft-user-service
  SERVICE_NAME: user-service
  SERVICE_PORT: 8081

jobs:
  # 代码质量检查
  code-quality:
    name: 代码质量检查
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: 运行代码质量检查
        run: |
          cd user-service
          mvn clean compile

  # 单元测试
  unit-tests:
    name: 单元测试
    runs-on: ubuntu-latest
    needs: code-quality
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: 运行单元测试
        run: |
          cd user-service
          mvn test
        continue-on-error: true  # 即使测试失败也继续流水线

      - name: 检查测试结果
        run: |
          cd user-service
          if [ -f target/surefire-reports/TEST-*.xml ]; then
            echo "✅ 测试报告已生成"
            # 可以在这里添加简单的测试结果统计
            echo "测试结果摘要:"
            find target/surefire-reports -name "TEST-*.xml" -exec basename {} \; | wc -l | xargs echo "测试文件数量:"
          else
            echo "⚠️ 未找到测试报告，但继续流水线执行"
          fi

  # 构建服务
  build-service:
    name: 构建用户服务
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: 构建用户服务
        run: |
          cd user-service
          mvn clean package -DskipTests

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: user-service-jar
          path: user-service/target/*.jar
          retention-days: 7

  # Docker镜像构建和推送
  build-and-push-image:
    name: 构建并推送Docker镜像
    runs-on: ubuntu-latest
    needs: build-service
    outputs:
      image-tag: ${{ steps.meta.outputs.tags }}
      image-digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 下载构建产物
        uses: actions/download-artifact@v4
        with:
          name: user-service-jar
          path: user-service/target/

      - name: 设置Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录阿里云镜像仓库
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: 提取元数据
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: 构建并推送Docker镜像
        id: build
        uses: docker/build-push-action@v5
        with:
          context: user-service
          file: user-service/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # 安全扫描
  security-scan:
    name: 安全扫描
    runs-on: ubuntu-latest
    needs: build-and-push-image
    steps:
      - name: 登录阿里云镜像仓库
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: 运行Trivy漏洞扫描
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:micro_user_service-${{ github.sha }}
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: 上传Trivy扫描结果到GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

  # 部署到开发环境
  deploy-dev:
    name: 部署到开发环境
    runs-on: ubuntu-latest
    needs: [build-and-push-image, security-scan]
    if: github.ref == 'refs/heads/micro_user_service'
    environment: development
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'v1.28.0'

      - name: 配置SSH密钥
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          
          # 兼容单主机和多主机配置
          if [ -n "${{ secrets.SERVER_HOST }}" ]; then
            ssh-keyscan -H ${{ secrets.SERVER_HOST }} >> ~/.ssh/known_hosts
          elif [ -n "${{ secrets.DEV_HOST }}" ]; then
            ssh-keyscan -H ${{ secrets.DEV_HOST }} >> ~/.ssh/known_hosts
          else
            echo "错误: 未配置SERVER_HOST或DEV_HOST"
            exit 1
          fi

      - name: 部署到开发环境K8s集群
        run: |
          # 确定使用的主机地址
          if [ -n "${{ secrets.SERVER_HOST }}" ]; then
            HOST="${{ secrets.SERVER_HOST }}"
          else
            HOST="${{ secrets.DEV_HOST }}"
          fi
          
          echo "部署到主机: $HOST"
          
          # 将K8s配置文件复制到云主机并部署
          scp -r k8s/ root@$HOST:~/
          
          ssh root@$HOST '
            # 创建部署目录（如果不存在）
            mkdir -p ~/edusoft-k8s
            
            # 首次部署：应用所有配置文件
            if ! kubectl get deployment edusoft-user-service -n edusoft >/dev/null 2>&1; then
              echo "首次部署，应用完整配置..."
              kubectl apply -f ~/k8s/database/mysql-user-service.yaml
              kubectl apply -f ~/k8s/user-service/deployment.yaml
              kubectl rollout status deployment/mysql-user-service -n edusoft --timeout=300s
              kubectl rollout status deployment/edusoft-user-service -n edusoft --timeout=300s
            else
              echo "更新现有部署..."
              kubectl set image deployment/edusoft-user-service user-service=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:micro_user_service-${{ github.sha }} -n edusoft
              kubectl rollout status deployment/edusoft-user-service -n edusoft --timeout=300s
            fi
            
            echo "用户服务已成功部署到开发环境！"
          '

  # 部署到生产环境
  deploy-prod:
    name: 部署到生产环境
    runs-on: ubuntu-latest
    needs: [build-and-push-image, security-scan]
    if: github.ref == 'refs/heads/main'
    environment: production
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置SSH密钥
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          
          # 兼容单主机和多主机配置
          if [ -n "${{ secrets.SERVER_HOST }}" ]; then
            # 单主机模式
            ssh-keyscan -H ${{ secrets.SERVER_HOST }} >> ~/.ssh/known_hosts
          else
            # 多主机模式
            if [ -n "${{ secrets.PROD_HOST_1 }}" ]; then
              ssh-keyscan -H ${{ secrets.PROD_HOST_1 }} >> ~/.ssh/known_hosts
            fi
            if [ -n "${{ secrets.PROD_HOST_2 }}" ]; then
              ssh-keyscan -H ${{ secrets.PROD_HOST_2 }} >> ~/.ssh/known_hosts
            fi
            if [ -n "${{ secrets.PROD_HOST_3 }}" ]; then
              ssh-keyscan -H ${{ secrets.PROD_HOST_3 }} >> ~/.ssh/known_hosts
            fi
          fi

      - name: 部署到生产环境K8s集群
        run: |
          if [ -n "${{ secrets.SERVER_HOST }}" ]; then
            # 单主机模式部署
            echo "单主机模式部署到: ${{ secrets.SERVER_HOST }}"
            
            # 将K8s配置文件复制到云主机
            scp -r k8s/ root@${{ secrets.SERVER_HOST }}:~/
            
            ssh root@${{ secrets.SERVER_HOST }} '
              # 创建部署目录（如果不存在）
              mkdir -p ~/edusoft-k8s
              
              # 首次部署：应用所有配置文件
              if ! kubectl get deployment edusoft-user-service -n edusoft >/dev/null 2>&1; then
                echo "首次部署，应用完整配置..."
                kubectl apply -f ~/k8s/database/mysql-user-service.yaml
                kubectl apply -f ~/k8s/user-service/deployment.yaml
                kubectl rollout status deployment/mysql-user-service -n edusoft --timeout=300s
                kubectl rollout status deployment/edusoft-user-service -n edusoft --timeout=300s
              else
                echo "更新现有部署..."
                kubectl set image deployment/edusoft-user-service user-service=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:micro_user_service-${{ github.sha }} -n edusoft
                kubectl rollout status deployment/edusoft-user-service -n edusoft --timeout=300s
              fi
            '
          else
            # 多主机模式部署
            echo "多主机模式部署..."
            
            # 部署到主生产环境
            if [ -n "${{ secrets.PROD_HOST_1 }}" ]; then
              echo "部署到主生产环境: ${{ secrets.PROD_HOST_1 }}"
              scp -r k8s/ root@${{ secrets.PROD_HOST_1 }}:~/
              ssh root@${{ secrets.PROD_HOST_1 }} '
                mkdir -p ~/edusoft-k8s
                if ! kubectl get deployment edusoft-user-service -n edusoft >/dev/null 2>&1; then
                  kubectl apply -f ~/k8s/database/mysql-user-service.yaml
                  kubectl apply -f ~/k8s/user-service/deployment.yaml
                  kubectl rollout status deployment/mysql-user-service -n edusoft --timeout=300s
                  kubectl rollout status deployment/edusoft-user-service -n edusoft --timeout=300s
                else
                  kubectl set image deployment/edusoft-user-service user-service=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:micro_user_service-${{ github.sha }} -n edusoft
                  kubectl rollout status deployment/edusoft-user-service -n edusoft --timeout=300s
                fi
              '
            fi
            
            # 同步到备用生产环境
            if [ -n "${{ secrets.PROD_HOST_2 }}" ]; then
              echo "部署到备用生产环境: ${{ secrets.PROD_HOST_2 }}"
              scp -r k8s/ root@${{ secrets.PROD_HOST_2 }}:~/
              ssh root@${{ secrets.PROD_HOST_2 }} '
                mkdir -p ~/edusoft-k8s
                if ! kubectl get deployment edusoft-user-service -n edusoft >/dev/null 2>&1; then
                  kubectl apply -f ~/k8s/database/mysql-user-service.yaml
                  kubectl apply -f ~/k8s/user-service/deployment.yaml
                  kubectl rollout status deployment/mysql-user-service -n edusoft --timeout=300s
                  kubectl rollout status deployment/edusoft-user-service -n edusoft --timeout=300s
                else
                  kubectl set image deployment/edusoft-user-service user-service=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:micro_user_service-${{ github.sha }} -n edusoft
                  kubectl rollout status deployment/edusoft-user-service -n edusoft --timeout=300s
                fi
              '
            fi
            
            # 部署到第三个环境（如果存在）
            if [ -n "${{ secrets.PROD_HOST_3 }}" ]; then
              echo "部署到第三生产环境: ${{ secrets.PROD_HOST_3 }}"
              scp -r k8s/ root@${{ secrets.PROD_HOST_3 }}:~/
              ssh root@${{ secrets.PROD_HOST_3 }} '
                mkdir -p ~/edusoft-k8s
                if ! kubectl get deployment edusoft-user-service -n edusoft >/dev/null 2>&1; then
                  kubectl apply -f ~/k8s/database/mysql-user-service.yaml
                  kubectl apply -f ~/k8s/user-service/deployment.yaml
                  kubectl rollout status deployment/mysql-user-service -n edusoft --timeout=300s
                  kubectl rollout status deployment/edusoft-user-service -n edusoft --timeout=300s
                else
                  kubectl set image deployment/edusoft-user-service user-service=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:micro_user_service-${{ github.sha }} -n edusoft
                  kubectl rollout status deployment/edusoft-user-service -n edusoft --timeout=300s
                fi
              '
            fi
          fi

      - name: 健康检查
        run: |
          echo "等待服务启动..."
          sleep 30
          
          if [ -n "${{ secrets.SERVER_HOST }}" ]; then
            # 单主机健康检查
            echo "检查单主机健康状态..."
            curl -f http://${{ secrets.SERVER_HOST }}/api/user/health || exit 1
            echo "单主机生产环境部署成功并通过健康检查！"
          else
            # 多主机健康检查
            echo "检查多主机健康状态..."
            
            if [ -n "${{ secrets.PROD_HOST_1 }}" ]; then
              curl -f http://${{ secrets.PROD_HOST_1 }}/api/user/health || exit 1
            fi
            if [ -n "${{ secrets.PROD_HOST_2 }}" ]; then
              curl -f http://${{ secrets.PROD_HOST_2 }}/api/user/health || exit 1
            fi
            if [ -n "${{ secrets.PROD_HOST_3 }}" ]; then
              curl -f http://${{ secrets.PROD_HOST_3 }}/api/user/health || exit 1
            fi
            
            echo "所有生产环境部署成功并通过健康检查！"
          fi

  # 通知
  notify:
    name: 流水线通知
    runs-on: ubuntu-latest
    needs: [build-and-push-image, security-scan]
    if: always()
    steps:
      - name: 检查流水线状态
        run: |
          echo "🔍 检查流水线执行状态..."
          echo "构建镜像状态: ${{ needs.build-and-push-image.result }}"
          echo "安全扫描状态: ${{ needs.security-scan.result }}"
          
      - name: 发送成功通知
        if: needs.build-and-push-image.result == 'success' && needs.security-scan.result == 'success'
        run: |
          echo "✅ 用户服务构建和扫描成功"
          echo "🚀 镜像版本: ${{ github.sha }}"
          echo "🔗 分支: ${{ github.ref_name }}"
          echo "📦 镜像已推送到镜像仓库"
          
      - name: 发送部分成功通知
        if: needs.build-and-push-image.result == 'success' && needs.security-scan.result != 'success'
        run: |
          echo "⚠️ 用户服务构建成功，但安全扫描有问题"
          echo "🚀 镜像版本: ${{ github.sha }}"
          echo "🔗 分支: ${{ github.ref_name }}"
          echo "⚠️ 请检查安全扫描结果"
          
      - name: 发送失败通知
        if: needs.build-and-push-image.result != 'success'
        run: |
          echo "❌ 用户服务构建失败"
          echo "🔍 请检查构建日志"
          echo "🔗 分支: ${{ github.ref_name }}"

  # 部署通知（仅在有部署时运行）
  deployment-notify:
    name: 部署结果通知
    runs-on: ubuntu-latest
    needs: [deploy-dev, deploy-prod]
    if: always() && (needs.deploy-dev.result != 'skipped' || needs.deploy-prod.result != 'skipped')
    steps:
      - name: 检查部署状态
        run: |
          echo "🔍 检查部署执行状态..."
          echo "开发环境部署状态: ${{ needs.deploy-dev.result }}"
          echo "生产环境部署状态: ${{ needs.deploy-prod.result }}"
          
      - name: 发送部署成功通知
        if: (needs.deploy-dev.result == 'success' || needs.deploy-dev.result == 'skipped') && (needs.deploy-prod.result == 'success' || needs.deploy-prod.result == 'skipped')
        run: |
          echo "✅ 用户服务部署成功"
          echo "🚀 镜像版本: ${{ github.sha }}"
          echo "🔗 分支: ${{ github.ref_name }}"
          if [ "${{ needs.deploy-dev.result }}" = "success" ]; then
            echo "🟢 开发环境部署成功"
          fi
          if [ "${{ needs.deploy-prod.result }}" = "success" ]; then
            echo "🟢 生产环境部署成功"
          fi
          
      - name: 发送部署失败通知
        if: needs.deploy-dev.result == 'failure' || needs.deploy-prod.result == 'failure'
        run: |
          echo "❌ 用户服务部署失败"
          echo "🔍 请检查部署日志"
          echo "🔗 分支: ${{ github.ref_name }}"
          if [ "${{ needs.deploy-dev.result }}" = "failure" ]; then
            echo "🔴 开发环境部署失败"
          fi
          if [ "${{ needs.deploy-prod.result }}" = "failure" ]; then
            echo "🔴 生产环境部署失败"
          fi
