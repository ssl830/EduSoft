# 当push到任意分支时自动触发
on:
  push:
    branches:
      - 'micro_frontend_service'

jobs:
  build-frontend:
    name: 构建前端
    runs-on: ubuntu-latest
    steps:
      # 1. 检出代码
      - name: 检出代码
        uses: actions/checkout@v4

      # 2. 设置Node.js环境
      - name: 设置Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      # 3. 安装依赖
      - name: 安装依赖
        run: |
          cd frontend
          npm install

      # 4. 构建前端
      - name: 构建前端
        run: |
          cd frontend
          npm run build

  dockerize_frontend:
    name: 前端镜像化并推送
    runs-on: ubuntu-latest
    needs: build-frontend
    steps:
      - name: 检出代码
        uses: actions/checkout@v4


      - name: 登录 Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 构建前端镜像
        run: |
          cd frontend
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/edusoft-frontend:latest .

      - name: 推送前端镜像
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/edusoft-frontend:latest