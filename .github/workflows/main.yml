# 当push到user-service分支时自动触发
on:
  push:
    branches:
      - 'user-service-sjy'

jobs:
  dockerize_user_service:
    name: 用户服务镜像化并推送
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 登录 Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 构建用户服务镜像
        run: |
          cd user-service
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/edusoft-user-service:latest .

      - name: 推送用户服务镜像
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/edusoft-user-service:latest