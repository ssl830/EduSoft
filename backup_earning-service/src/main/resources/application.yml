server:
  port: 8082

spring:
  application:
    name: learning-service
  datasource:
    url: jdbc:mysql://localhost:3306/edusoft?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai

mybatis:
  mapper-locations: classpath:mapper/**/*.xml
  type-aliases-package: org.example.edusoft.learning.entity

feign:
  hystrix:
    enabled: true

# eureka/注册中心配置（如使用）
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

logging:
  level:
    org.example.edusoft: debug
